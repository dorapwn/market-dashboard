name: Refresh market snapshot

# Keeps data/snapshot.json fresh so the dashboard still shows recent numbers
# when the live feeds are unreachable (rate limits, upstream outages, CORS
# proxy failures). The commit it pushes triggers the Pages deploy.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  # Commits made by GITHUB_TOKEN do NOT trigger other workflows, so the
  # snapshot refresh would never reach the deployed site. This explicit
  # dispatch does trigger the Pages deploy.
  workflow_run:
    workflows: ["Refresh market snapshot"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate snapshot
        run: node scripts/make-snapshot.js

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/snapshot.json; then
            echo "Snapshot unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "chore: refresh market snapshot"
          git push
