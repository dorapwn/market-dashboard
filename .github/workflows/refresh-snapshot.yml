name: Refresh market snapshot

# Keeps data/snapshot.json fresh so the dashboard still shows recent numbers
# when the live feeds are unreachable (rate limits, upstream outages, CORS
# proxy failures). The commit it pushes triggers the Pages deploy.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  # NOTE: deliberately no `workflow_run` trigger here. Listing this workflow
  # in its own `workflow_run.workflows` makes its completion re-trigger
  # itself, which fails as an invalid workflow file. The deploy chaining
  # lives in deploy.yml, which is the only side that needs it.

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate snapshot
        run: node scripts/make-snapshot.js

      # The heatmap covers the whole S&P 500 and needs GICS classifications
      # (from Wikipedia) plus market caps (from Yahoo's timeseries API). It
      # is a separate dataset from the snapshot because it is much larger
      # and changes far less often.
      - name: Generate heatmap dataset
        run: |
          set -euo pipefail
          python3 scripts/build-heatmap.py

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/snapshot.json data/heatmap.json; then
            echo "Snapshot unchanged — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/heatmap.json
          git commit -m "chore: refresh market snapshot"
          git push
