name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The snapshot workflow commits with GITHUB_TOKEN, and such commits do not
  # fire `push` triggers. workflow_run closes that gap so a refreshed
  # snapshot is actually deployed.
  workflow_run:
    workflows: ["Refresh market snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify assets and links
        run: |
          set -euo pipefail
          test -f index.html
          test -f assets/style.css
          test -f assets/app.js
          test -f assets/portfolio.js
          test -f assets/portfolio-model.js
          test -f assets/vendor/uPlot.min.js
          test -f assets/vendor/uPlot.min.css
          test -f data/snapshot.json
          grep -q 'assets/app.js' index.html || { echo 'ERROR: app.js not referenced'; exit 1; }
          grep -q 'assets/style.css' index.html || { echo 'ERROR: style.css not referenced'; exit 1; }
          grep -q 'uPlot.min.js' index.html || { echo 'ERROR: uPlot not referenced'; exit 1; }
          grep -q 'assets/portfolio.js' index.html || { echo 'ERROR: portfolio.js not referenced'; exit 1; }
          grep -q 'assets/portfolio-model.js' index.html || { echo 'ERROR: portfolio-model.js not referenced'; exit 1; }
          echo "asset check OK"

      - name: Run unit tests
        run: |
          set -euo pipefail
          node --test 'test/*.test.js'
          echo "unit tests OK"

      - name: Guard against publishing sensitive portfolio data
        run: |
          set -euo pipefail
          # The portfolio section may only carry allocation weights (ratios).
          # Absolute dollar amounts, share counts, valuation figures and
          # account details must never reach this public repository.
          #
          # These patterns target JS *value* positions (after ':' or '='), not
          # prose — the portfolio.js header comment deliberately names the
          # excluded fields, so a naive keyword scan would flag its own docs.
          if grep -rnE '\$[0-9]' assets/portfolio.js index.html; then
            echo "ERROR: dollar amount found in published portfolio data"; exit 1
          fi
          if grep -rniE '["'"'"']?(shares|quantity|units|costbasis|cost_basis|amount)["'"'"']?[[:space:]]*[:=]' assets/portfolio.js; then
            echo "ERROR: position size field found in published portfolio data"; exit 1
          fi
          if grep -rniE '(fwd|forward)[ _-]?p/?e["'"'"']?[[:space:]]*[:=]' assets/portfolio.js; then
            echo "ERROR: valuation multiple found in published portfolio data"; exit 1
          fi
          echo "privacy check OK"

      - name: Validate portfolio data against the publication rules
        run: |
          set -euo pipefail
          # Structural check: the model knows the exact key set a published
          # holding may carry, so a sensitive field fails here even when its
          # value happens to look innocuous — and a legitimate allocation
          # weight of 100 is not mistaken for a balance.
          node -e "
            const model = require('./assets/portfolio-model.js');
            const fs = require('fs');
            const src = fs.readFileSync('./assets/portfolio.js', 'utf8');
            const sandbox = { window: {} };
            new Function('window', src)(sandbox.window);
            const holdings = (sandbox.window.PORTFOLIO || {}).holdings || [];
            const res = model.validate(holdings);
            if (!res.ok) {
              console.error('ERROR: portfolio data violates the publication rules:');
              res.problems.forEach(p => console.error('  - ' + p));
              process.exit(1);
            }
            console.log('portfolio data OK: ' + holdings.length + ' holding(s)');
          "

      - name: Validate JSON snapshot
        run: |
          set -euo pipefail
          node -e "
            const s = require('./data/snapshot.json');
            if (!s.quotes || Object.keys(s.quotes).length === 0) {
              console.error('ERROR: snapshot has no quotes'); process.exit(1);
            }
            console.log('snapshot OK: ' + Object.keys(s.quotes).length + ' quotes, updated ' + s.updated);
          "

      - name: Syntax check JavaScript
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/portfolio-model.js
          node --check assets/portfolio.js
          node --check scripts/make-snapshot.js
          echo "js syntax OK"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployment
        run: |
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          sleep 10
          curl -fsSL -o /dev/null -w "HTTP %{http_code}\n" "${{ steps.deployment.outputs.page_url }}"
